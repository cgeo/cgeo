# build addons in parallel to main app
org.gradle.parallel = true

# Use more memory to benefit from in-process dexing
# Use the parallel garbage collector
# MaxMetaspaceSize=1g: Sufficient for typical builds (reduced from 4g)
# file.encoding=UTF-8: Ensures consistent build behaviour across different OS environments
org.gradle.jvmargs = -Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Activate build caching
org.gradle.caching = true

# activating configuration cache, see https://docs.gradle.org/8.1/userguide/configuration_cache.html
org.gradle.configuration-cache = true
# deactivated for DependencyUpdates task, see https://github.com/ben-manes/gradle-versions-plugin?tab=readme-ov-file#workarounds-for-related-gradle-issues
#org.gradle.configuration-cache.problems=warn

# Avoid printing release notes after gradle version upgrades. See https://github.com/gradle/gradle/issues/5213
org.gradle.internal.launcher.welcomeMessageEnabled = false
systemProp.org.gradle.internal.launcher.welcomeMessageEnabled = false

# Performance optimizations
# Speed up compilation by not generating transitive resources in R classes
android.nonTransitiveRClass = true
# Extract resources in parallel for faster resource processing
android.experimental.parallelResourcesExtraction = true

# For local instrumented tests: leave original c:geo installation intact on device
android.injected.androidTest.leaveApksInstalledAfterRun = true

# Legacy Compatibility & Stability
# Disables aggressive R8 rules that could break reflection/JNI (e.g. Jackson, Bergamot)
android.r8.strictFullModeForKeepRules = false

# Global Build Feature Defaults
# Disable unused features to improve configuration speed
android.defaults.buildfeatures.resvalues = false
android.defaults.buildfeatures.shaders = false
android.defaults.buildfeatures.databinding = false
android.defaults.buildfeatures.mlmodelbinding = false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
